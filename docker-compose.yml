# Stack local: imita la arquitectura que luego irá en AWS.
#   red "publica"  -> solo el servidor web (puerto 8000 publicado en el host)
#   red "privada"  -> la base de datos; es "internal": sin salida ni acceso desde fuera,
#                     solo el contenedor web llega a ella (equivale a la subred privada)
name: bodega-cafe

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bodega}
      POSTGRES_USER: ${POSTGRES_USER:-bodega}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [privada]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bodega}
      CSV_PATH: /data/lecturas.csv
      API_KEY: ${API_KEY:?Define API_KEY en .env}
      TEMP_MIN: ${TEMP_MIN:-15}
      TEMP_MAX: ${TEMP_MAX:-25}
      HUM_MIN: ${HUM_MIN:-50}
      HUM_MAX: ${HUM_MAX:-65}
    volumes:
      - ./data:/data          # el CSV queda visible en ./data/lecturas.csv
    ports:
      - "${WEB_PORT:-8000}:8000"
    networks: [publica, privada]

networks:
  publica: {}
  privada:
    internal: true

volumes:
  pgdata: {}
